<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Wayfarer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="brand">Wayfarer</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
      <div class="search-group">
        <input type="text" id="search-input" placeholder="Search beach, temple, country...">
        <button id="search-btn">Search</button>
        <button id="clear-btn">Clear</button>
      </div>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>
    <p class="tagline">Questions, corrections, or a place we should add? Reach out.</p>

    <div class="info-block">
      <p><strong>Email:</strong> hello@wayfarer-travel.example</p>
      <p><strong>Response time:</strong> within 2 business days</p>
    </div>

    <div class="info-block">
      <form class="contact-form" onsubmit="return false;">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit">Send message</button>
      </form>
    </div>

    <div id="results"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
